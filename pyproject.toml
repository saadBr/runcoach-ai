[project]
name = "pacecraft-ai"
version = "0.1.0"
description = "AI-powered running performance analysis and coaching platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "defusedxml>=0.7.1,<1",
    "fastapi>=0.116,<1",
    "garmin-fit-sdk==21.213.0",
    "pandas>=2.2,<3",
    "plotly>=6,<7",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.49,<2",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "mypy>=1.17,<2",
    "pandas-stubs>=2.2,<3",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "types-defusedxml>=0.7.0.20260504,<0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runcoach"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["runcoach"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
